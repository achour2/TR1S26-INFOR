{% load static %}
<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ titre_page }} — TravelHub</title><link rel="stylesheet" href="{% static 'css/voyage.css' %}"><link rel="stylesheet" href="{% static 'css/destination.css' %}"></head>
<body class="app-page">
{% include 'partials/navigation.html' %}
<main class="form-shell">
    <a class="back-link" href="{% if destination %}{% url 'voyage:destination:detail' voyage.pk destination.pk %}{% else %}{% url 'voyage:detail' voyage.pk %}{% endif %}">← Retour au voyage</a>
    <section class="form-card"><p class="eyebrow">{{ voyage.titre }}</p><h1>{{ titre_page }}</h1><p class="intro">Précisez le lieu et les dates de votre étape.</p>
        {% for erreur in erreurs %}<p class="error-message" role="alert">{{ erreur }}</p>{% endfor %}
        <form class="trip-form" method="post">{% csrf_token %}
            <p><label for="ville">Ville</label><input id="ville" name="ville" maxlength="100" required value="{{ valeurs.ville|default:'' }}"></p>
            <p><label for="pays">Pays</label><input id="pays" name="pays" maxlength="500" required value="{{ valeurs.pays|default:'' }}"></p>
            <p><label for="date_Arrive">Date d'arrivée</label><input id="date_Arrive" name="date_Arrive" type="date" required value="{{ valeurs.date_Arrive|date:'Y-m-d' }}"></p>
            <p><label for="date_Depart">Date de départ</label><input id="date_Depart" name="date_Depart" type="date" required value="{{ valeurs.date_Depart|date:'Y-m-d' }}"></p>
            <div class="form-actions"><button class="button button-primary" type="submit">{{ bouton }}</button><a class="button button-quiet" href="{% if destination %}{% url 'voyage:destination:detail' voyage.pk destination.pk %}{% else %}{% url 'voyage:detail' voyage.pk %}{% endif %}">Annuler</a></div>
        </form>
    </section>
</main>
</body>
</html>
